services:

  # 2. MySQL 데이터베이스 서비스
  ex-log-db:
    image: mysql:8.0
    container_name: ex-log-db
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    restart: always

  # 3. Redis 캐시 서비스
  exlog-redis:
    image: redis:latest
    container_name: exlog-redis
    ports:
      - "6379:6379"
    restart: always
