<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ex-Log 로그인</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f7f6; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; }
        .form-group { display: flex; flex-direction: column; gap: 15px; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
        button { padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0069d9; }
        .link { text-align: center; margin-top: 15px; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Ex-Log 로그인</h2>
    <div class="form-group">
        <input type="email" id="email" placeholder="이메일" required>
        <input type="password" id="password" placeholder="비밀번호" required>
        <button onclick="handleLogin()">로그인</button>
    </div>
    <div class="link">
        <a href="/signup">처음이신가요? 회원가입</a>
    </div>
</div>

<script>
    async function handleLogin() {
        const loginData = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            });

            if (response.ok) {
                const result = await response.json();
                alert(result.username + "님, 환영합니다!");
                window.location.href = '/category';
            } else {
                alert("로그인 실패: 이메일이나 비밀번호를 확인하세요.");
            }
        } catch (error) {
            console.error("에러 발생:", error);
        }
    }
</script>
</body>
</html>
