<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ex-Log 회원가입</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f7f6; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; }
        .form-group { display: flex; flex-direction: column; gap: 15px; }
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        button { padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .link { text-align: center; margin-top: 15px; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Ex-Log 회원가입</h2>
    <div class="form-group">
        <input type="email" id="email" placeholder="이메일 (ID)" required>
        <input type="password" id="password" placeholder="비밀번호" required>
        <input type="text" id="username" placeholder="이름 (닉네임)" required>
        <select id="gender">
            <option value="">성별 선택</option>
            <option value="MALE">남성</option>
            <option value="FEMALE">여성</option>
        </select>
        <button onclick="handleSignup()">가입하기</button>
    </div>
    <div class="link">
        <a href="/login">이미 계정이 있나요? 로그인</a>
    </div>
</div>

<script>
    async function handleSignup() {
        const signupData = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            username: document.getElementById('username').value,
            gender: document.getElementById('gender').value
        };

        if (!signupData.gender) { alert("성별을 선택해주세요!"); return; }

        try {
            const response = await fetch('/api/v1/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(signupData)
            });

            if (response.ok) {
                alert("회원가입이 완료되었습니다!");
                window.location.href = '/login';
            } else {
                const msg = await response.text();
                alert("가입 실패: " + msg);
            }
        } catch (error) {
            console.error("에러 발생:", error);
        }
    }
</script>
</body>
</html>
