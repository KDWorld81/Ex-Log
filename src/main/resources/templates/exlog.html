<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ex-Log</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: url('/images/exlogmark.jpg') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }
        .overlay {
            background: rgba(0, 0, 0, 0.6);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .title { font-size: 4rem; margin-bottom: 10px; font-weight: bold; }
        .btn-start {
            padding: 15px 40px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.2rem;
            transition: 0.3s;
        }
        .btn-start:hover { background-color: #0056b3; }
    </style>
</head>
<body>
<div class="overlay">
    <h1 class="title">Ex-Log</h1>
    <p style="margin-bottom: 30px;">기록이 곧 실력이 된다</p>
    <a th:href="@{/signup}" class="btn-start">시작하기</a>
</div>
</body>
</html>
