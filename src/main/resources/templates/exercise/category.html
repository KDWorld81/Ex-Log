<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ex-Log Category</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 30px;
            font-size: 1.5rem;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .category-card {
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* 마지막 '팔' 카드를 중앙 정렬 */
        .category-card:last-child {
            grid-column: span 2;
            max-width: calc(50% - 7.5px);
            margin: 0 auto;
            width: 100%;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-color: var(--primary-color);
        }

        .category-card.active {
            border-color: var(--primary-color);
            background-color: #ebf4ff;
        }

        .category-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: block;
        }

        .category-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>어떤 부위를 운동하시나요?</h2>
    <div class="category-grid">
        <div class="category-card" onclick="selectCategory(this)">
            <span class="category-icon">🏋️</span>
            <span class="category-name">가슴</span>
        </div>
        <div class="category-card" onclick="selectCategory(this)">
            <span class="category-icon">🏋️</span>
            <span class="category-name">등</span>
        </div>
        <div class="category-card" onclick="selectCategory(this)">
            <span class="category-icon">🏋️</span>
            <span class="category-name">하체</span>
        </div>
        <div class="category-card" onclick="selectCategory(this)">
            <span class="category-icon">🏋️</span>
            <span class="category-name">어깨</span>
        </div>
        <div class="category-card" onclick="selectCategory(this)">
            <span class="category-icon">🏋️</span>
            <span class="category-name">팔</span>
        </div>
    </div>
</div>

<script>
    function selectCategory(element) {
        const cards = document.querySelectorAll('.category-card');
        cards.forEach(card => card.classList.remove('active'));

        element.classList.add('active');

        const category = element.querySelector('.category-name').innerText;
        console.log("선택된 카테고리:", category);
    }
</script>

</body>
</html>
