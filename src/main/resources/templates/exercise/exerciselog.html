<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ex-Log | 운동 기록</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding-top: 50px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-btn {
            cursor: pointer;
            font-size: 1.5rem;
            margin-right: 15px;
            background: none;
            border: none;
            color: var(--text-color);
        }

        h2 {
            margin: 0;
            color: var(--text-color);
            font-size: 1.5rem;
        }

        .input-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .input-group { margin-bottom: 20px; }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1.1rem;
        }

        .save-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="back-btn" id="go-back">←</button>
        <h2 id="log-title">운동 기록</h2>
    </div>

    <div class="input-card">
        <div class="input-group">
            <label id="label-top">세트 수</label>
            <input type="number" id="input-top" placeholder="예: 5" inputmode="numeric">
        </div>
        <div class="input-group">
            <label id="label-bottom">횟수 (reps)</label>
            <input type="number" id="input-bottom" placeholder="예: 12" inputmode="numeric">
        </div>
        <button class="save-btn" onclick="submitLog()">기록 완료</button>
    </div>
</div>

<script>
    let categoryId, exerciseId;

    document.addEventListener('DOMContentLoaded', () => {
        const pathParts = window.location.pathname.split('/');
        exerciseId = pathParts[pathParts.length - 1];
        categoryId = pathParts[pathParts.length - 3];

        if (categoryId === '6') {
            document.getElementById('log-title').innerText = "유산소 기록";
            document.getElementById('label-top').innerText = "운동 시간 (분)";
            document.getElementById('input-top').placeholder = "예: 30";
            document.getElementById('label-bottom').innerText = "거리 (km)";
            document.getElementById('input-bottom').placeholder = "예: 5.5";
            document.getElementById('input-bottom').setAttribute('step', '0.1');
        }

        document.getElementById('go-back').onclick = () => {
            location.href = `/exercise/${categoryId}`;
        };
    });

    async function submitLog() {
        const valTop = document.getElementById('input-top').value;
        const valBottom = document.getElementById('input-bottom').value;

        if (!valTop || !valBottom) {
            Swal.fire({
                icon: 'warning',
                title: '입력 확인',
                text: '모든 항목을 입력해주세요!',
                confirmButtonColor: '#4A90E2'
            });
            return;
        }

        const data = { exerciseId: parseInt(exerciseId) };
        if (categoryId === '6') {
            data.minutes = parseInt(valTop);
            data.distance = parseFloat(valBottom);
        } else {
            data.sets = parseInt(valTop);
            data.reps = parseInt(valBottom);
        }

        try {
            const response = await fetch('/api/v1/exercise-log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(data)
            });

            if (response.ok) {
                Swal.fire({
                    icon: 'success',
                    title: '기록 완료! 💪',
                    text: '오늘의 운동이 성공적으로 저장되었습니다.',
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    location.href = `/exercise/${categoryId}`;
                });
            } else {
                const errorData = await response.json();
                Swal.fire({
                    icon: 'error',
                    title: '저장 실패',
                    text: errorData.message || '알 수 없는 에러가 발생했습니다.',
                    confirmButtonColor: '#4A90E2'
                });
            }
        } catch (error) {
            console.error("Error:", error);
            Swal.fire({
                icon: 'error',
                title: '네트워크 에러',
                text: '서버와 연결할 수 없습니다.',
                confirmButtonColor: '#4A90E2'
            });
        }
    }
</script>

</body>
</html>
